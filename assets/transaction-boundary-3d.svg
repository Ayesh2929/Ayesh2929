<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Isometric transaction request and ownership boundary map</title>
  <desc id="desc">A source-backed diagram of a GrihaLakshmi request: household member, React client, Express API with JWT verification, then PostgreSQL operations scoped to the authenticated user. A return path carries the JSON response back. This is a source map, not a production security certification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172d"/><stop offset="1" stop-color="#080a15"/></linearGradient>
    <linearGradient id="front1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193955"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="front2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163d4a"/><stop offset="1" stop-color="#0e1c28"/></linearGradient>
    <linearGradient id="front3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33265c"/><stop offset="1" stop-color="#16142a"/></linearGradient>
    <linearGradient id="front4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28344f"/><stop offset="1" stop-color="#111827"/></linearGradient>
  </defs>
  <rect width="1200" height="660" rx="26" fill="url(#bg)" stroke="#27304d"/>
  <circle cx="61" cy="52" r="5" fill="#a78bfa"/>
  <text x="82" y="57" font-family="ui-monospace,monospace" font-size="14" letter-spacing="1.6" fill="#c4b5fd">GṚHALAKṢMĪ / REQUEST TRACE</text>
  <text x="1138" y="57" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.2" fill="#70dfeb">ISOMETRIC SOURCE MAP · NOT A SECURITY CERTIFICATION</text>
  <path d="M60 82H1140" stroke="#242c48"/>
  <text x="60" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#f2f3ff">From a household action to a scoped record</text>
  <text x="60" y="147" font-family="ui-monospace,monospace" font-size="11" letter-spacing=".8" fill="#8e9ab9">REQUEST: CLIENT → API → VERIFIED IDENTITY → DATABASE</text>

  <!-- Thin perspective rails establish a 3D workspace without adding data semantics. -->
  <path d="M62 483 1135 483M93 503 1165 503" stroke="#25304a" fill="none"/>
  <path d="M107 463 154 529M375 463 422 529M643 463 690 529M911 463 958 529" stroke="#202a42" fill="none"/>

  <!-- 01 Household/member block -->
  <path d="M65 218 85 201H297L277 218Z" fill="#3e7395" stroke="#82d8f4" stroke-width="1.4"/>
  <path d="M277 218 297 201V411L277 428Z" fill="#152841" stroke="#5baaca" stroke-width="1.4"/>
  <rect x="65" y="218" width="212" height="210" fill="url(#front1)" stroke="#72c9ec" stroke-width="1.4"/>
  <text x="84" y="252" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.1" fill="#92dbf6">01 / ACTOR</text>
  <text x="84" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f7ff">MEMBER</text>
  <text x="84" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c1d4e3">Household action</text>
  <path d="M84 337H255" stroke="#34516c"/>
  <text x="84" y="365" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".5" fill="#a7cce4">Starts in the UI</text>
  <text x="84" y="390" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".4" fill="#7189a9">Input details vary by route.</text>

  <!-- 02 React client block -->
  <path d="M333 218 353 201H565L545 218Z" fill="#34778a" stroke="#73e1e7" stroke-width="1.4"/>
  <path d="M545 218 565 201V411L545 428Z" fill="#10303b" stroke="#4cbcc8" stroke-width="1.4"/>
  <rect x="333" y="218" width="212" height="210" fill="url(#front2)" stroke="#5dd4dd" stroke-width="1.4"/>
  <text x="352" y="252" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.1" fill="#8df0ef">02 / CLIENT</text>
  <text x="352" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#f0ffff">REACT UI</text>
  <text x="352" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c2e0e1">TypeScript · Vite</text>
  <path d="M352 337H523" stroke="#31545d"/>
  <text x="352" y="365" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".5" fill="#a7eeee">REST request</text>
  <text x="352" y="390" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".3" fill="#779ca7">Bearer token on protected routes</text>

  <!-- 03 Express/JWT boundary block -->
  <path d="M601 218 621 201H833L813 218Z" fill="#604a9c" stroke="#b7a1ff" stroke-width="1.4"/>
  <path d="M813 218 833 201V411L813 428Z" fill="#271d45" stroke="#9476df" stroke-width="1.4"/>
  <rect x="601" y="218" width="212" height="210" fill="url(#front3)" stroke="#a58af2" stroke-width="1.4"/>
  <text x="620" y="252" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.1" fill="#c9baff">03 / TRUST BOUNDARY</text>
  <text x="620" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#f6f2ff">EXPRESS API</text>
  <text x="620" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#d3c8ef">JWT middleware</text>
  <path d="M620 337H791" stroke="#4c3e6e"/>
  <text x="620" y="365" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".5" fill="#d7c9ff">Verify token → req.auth</text>
  <text x="620" y="390" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".3" fill="#a79abf">bcrypt is used in password flow</text>

  <!-- 04 PostgreSQL ownership block -->
  <path d="M869 218 889 201H1101L1081 218Z" fill="#4d648b" stroke="#b2c6f5" stroke-width="1.4"/>
  <path d="M1081 218 1101 201V411L1081 428Z" fill="#1a263b" stroke="#829dd0" stroke-width="1.4"/>
  <rect x="869" y="218" width="212" height="210" fill="url(#front4)" stroke="#9db6e9" stroke-width="1.4"/>
  <text x="888" y="252" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.1" fill="#c2d0ff">04 / STORAGE</text>
  <text x="888" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3f6ff">POSTGRESQL</text>
  <text x="888" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#cbd7ea">UUID + JSONB tables</text>
  <path d="M888 337H1059" stroke="#39465f"/>
  <text x="888" y="365" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".5" fill="#c6d6ff">user_id scope</text>
  <text x="888" y="390" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".3" fill="#96a8c7">owner_user_id on family/logs</text>

  <!-- Request arrows run through the four source-backed stages. -->
  <g fill="none" stroke-width="2">
    <path d="M298 298H321" stroke="#7bd6e9"/><path d="M566 298H589" stroke="#7bd6e9"/><path d="M834 298H857" stroke="#a78bfa"/>
  </g>
  <g fill="#7bd6e9"><path d="M321 292 331 298 321 304Z"/><path d="M589 292 599 298 589 304Z"/></g>
  <path d="M857 292 867 298 857 304Z" fill="#a78bfa"/>
  <g font-family="ui-monospace,monospace" font-size="9" letter-spacing=".5" text-anchor="middle" fill="#aab5d0">
    <text x="310" y="282">UI</text><text x="578" y="282">HTTP</text><text x="846" y="282">IDENTITY</text>
  </g>

  <!-- Return path is explicitly separate from the request path. -->
  <path d="M974 457V486H170V457" fill="none" stroke="#5bc5d7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <path d="M170 457 164 469H176Z" fill="#5bc5d7"/>
  <rect x="488" y="470" width="170" height="28" rx="14" fill="#0e1726" stroke="#28505d"/>
  <text x="573" y="488" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".8" fill="#84e3e9">JSON RESPONSE</text>

  <rect x="60" y="535" width="1080" height="75" rx="14" fill="#111423" stroke="#40345f"/>
  <circle cx="84" cy="572" r="5" fill="#a78bfa"/>
  <text x="104" y="565" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.2" fill="#c9baff">SECURITY NOTE</text>
  <text x="104" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#bac2db">Source includes a development JWT-secret fallback when the environment value is missing; deploy with a strong configured secret.</text>
</svg>
