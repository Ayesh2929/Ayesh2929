<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Isometric 3D chart: detected languages in selected repositories</title>
  <desc id="desc">A static isometric bar chart. TypeScript appears in three selected repositories; JavaScript and CSS in two each; Shell, Lua, and Python in one each. Counts are repository presence, not skill or lines of code.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11172c"/><stop offset="1" stop-color="#080b17"/></linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7a0ff"/><stop offset="1" stop-color="#633bd5"/></linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9af4ff"/><stop offset="1" stop-color="#168ca7"/></linearGradient>
    <linearGradient id="css" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a0f6d2"/><stop offset="1" stop-color="#218866"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe0a2"/><stop offset="1" stop-color="#b36c16"/></linearGradient>
    <linearGradient id="lua" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb2d0"/><stop offset="1" stop-color="#ac3972"/></linearGradient>
    <linearGradient id="python" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b4d2ff"/><stop offset="1" stop-color="#3e66bd"/></linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="590" rx="26" fill="url(#panel)" stroke="#252c49"/>
  <path d="M26 116H1174" stroke="#242b46"/>
  <circle cx="61" cy="63" r="6" fill="#a78bfa"/>
  <text x="82" y="68" class="mono" font-size="15" fill="#c9bbff">DATA SIGNAL / 03 REPOSITORIES</text>
  <text x="1137" y="68" text-anchor="end" class="mono" font-size="12" fill="#67e8f9">ISOMETRIC VIEW · STATIC SNAPSHOT</text>
  <text x="62" y="102" class="sans" font-size="25" font-weight="650" fill="#f1f2fb">Language footprint</text>
  <text x="1138" y="101" text-anchor="end" class="mono" font-size="13" fill="#929bb9">1 bar unit = 1 repository detects the language</text>

  <!-- Back-plane grid: perspective cues only; the Y-axis still encodes integer repository count. -->
  <g fill="none" stroke="#313958" stroke-width="1">
    <path d="M190 438H1080M190 360H1080M190 282H1080M190 204H1080"/>
    <path d="M190 438 224 412M1080 438 1114 412M190 360 224 334M1080 360 1114 334M190 282 224 256M1080 282 1114 256M190 204 224 178M1080 204 1114 178" opacity=".55"/>
    <path d="M190 204 224 178H1114V412" opacity=".45"/>
    <path d="M190 438 224 412H1114" stroke="#56617f"/>
  </g>
  <g class="mono" font-size="14" fill="#9ba5c3" text-anchor="end">
    <text x="169" y="443">0</text><text x="169" y="365">1</text><text x="169" y="287">2</text><text x="169" y="209">3</text>
  </g>
  <text x="74" y="293" class="mono" font-size="11" fill="#7984a7" transform="rotate(-90 74 293)">REPOSITORY COUNT</text>

  <!-- Each column is an extruded, isometric prism. Heights encode repository presence. -->
  <g stroke-linejoin="round" stroke-width="1.4">
    <!-- TypeScript: 3 -->
    <path d="M270 204 290 188H358L338 204Z" fill="#d0c3ff" stroke="#c8b6ff"/>
    <path d="M338 204 358 188V422L338 438Z" fill="#4c2aa4" stroke="#9573f4"/>
    <rect x="270" y="204" width="68" height="234" fill="url(#ts)" stroke="#b9a7ff"/>
    <!-- JavaScript: 2 -->
    <path d="M408 282 428 266H496L476 282Z" fill="#c5fbff" stroke="#9bf3ff"/>
    <path d="M476 282 496 266V422L476 438Z" fill="#11667a" stroke="#69e1f3"/>
    <rect x="408" y="282" width="68" height="156" fill="url(#js)" stroke="#9bf3ff"/>
    <!-- CSS: 2 -->
    <path d="M546 282 566 266H634L614 282Z" fill="#cbffe8" stroke="#9cf4cf"/>
    <path d="M614 282 634 266V422L614 438Z" fill="#17694b" stroke="#73dfb2"/>
    <rect x="546" y="282" width="68" height="156" fill="url(#css)" stroke="#9cf4cf"/>
    <!-- Shell: 1 -->
    <path d="M684 360 704 344H772L752 360Z" fill="#fff0cb" stroke="#ffdd9a"/>
    <path d="M752 360 772 344V422L752 438Z" fill="#89500f" stroke="#eab458"/>
    <rect x="684" y="360" width="68" height="78" fill="url(#shell)" stroke="#ffdd9a"/>
    <!-- Lua: 1 -->
    <path d="M822 360 842 344H910L890 360Z" fill="#ffd3e5" stroke="#ffabd0"/>
    <path d="M890 360 910 344V422L890 438Z" fill="#812550" stroke="#e989b3"/>
    <rect x="822" y="360" width="68" height="78" fill="url(#lua)" stroke="#ffabd0"/>
    <!-- Python: 1 -->
    <path d="M960 360 980 344H1048L1028 360Z" fill="#d6e5ff" stroke="#aacaff"/>
    <path d="M1028 360 1048 344V422L1028 438Z" fill="#304e92" stroke="#86adf7"/>
    <rect x="960" y="360" width="68" height="78" fill="url(#python)" stroke="#aacaff"/>
  </g>
  <g class="mono" text-anchor="middle" font-size="15" font-weight="700" fill="#f6f5ff">
    <text x="304" y="191">3 / 3</text><text x="442" y="269">2 / 3</text><text x="580" y="269">2 / 3</text>
    <text x="718" y="347">1 / 3</text><text x="856" y="347">1 / 3</text><text x="994" y="347">1 / 3</text>
  </g>
  <g class="sans" text-anchor="middle" font-size="15" fill="#d6daf0">
    <text x="304" y="474">TypeScript</text><text x="442" y="474">JavaScript</text><text x="580" y="474">CSS</text>
    <text x="718" y="474">Shell</text><text x="856" y="474">Lua</text><text x="994" y="474">Python</text>
  </g>
  <rect x="61" y="516" width="1078" height="42" rx="10" fill="#0e1324" stroke="#242b46"/>
  <text x="82" y="542" class="mono" font-size="11" fill="#7f8aa9">READ AS: repository presence only · not lines of code · not proficiency · not activity volume</text>
  <text x="1117" y="542" text-anchor="end" class="mono" font-size="11" fill="#67e8f9">SOURCE: GITHUB LINGUIST METADATA</text>
</svg>
